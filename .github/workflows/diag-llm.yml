name: diag-llm
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      GROQ_KEY: ${{ secrets.GROQ_API_KEY_FINANCE }}
      GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Groq (finance key, same call as finance)
        run: |
          curl -s -o /tmp/g.txt -w "groq http: %{http_code}\n" https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_KEY" -H "Content-Type: application/json" -A "ai-carryon-finance/1.0" \
            -d '{"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":"Say hi"}],"max_tokens":50}'
          head -c 200 /tmp/g.txt; echo
      - name: Groq with default urllib-style User-Agent
        run: |
          curl -s -o /tmp/g2.txt -w "groq (urllib UA) http: %{http_code}\n" https://api.groq.com/openai/v1/models \
            -H "Authorization: Bearer $GROQ_KEY" -A "Python-urllib/3.11"
          head -c 200 /tmp/g2.txt; echo
      - name: Gemini (shared key)
        run: |
          curl -s -o /tmp/m.txt -w "gemini http: %{http_code}\n" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent" \
            -H "x-goog-api-key: $GEMINI_KEY" -H "Content-Type: application/json" -A "ai-carryon-finance/1.0" \
            -d '{"contents":[{"parts":[{"text":"Say hi"}]}]}'
          head -c 200 /tmp/m.txt; echo
