name: Cricket Scheduler

on:
  schedule:
    # Hourly — scheduler_cricket.py's own daily cap (5/day) and adaptive-hour
    # gate decide whether this particular hour actually generates anything.
    # Matches are event-driven, so this is intentionally more frequent than
    # a fixed peak-hour approach.
    - cron: "0 * * * *"
    # Separate, once-a-day run for comment replies, near 7PM IST. UTC 14:00
    # is the nearest hourly-cron slot to 19:00 IST (= 19:30 IST exactly,
    # since IST is UTC+5:30 and cron only fires on the UTC hour).
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "generate a video, or process comment replies"
        required: false
        default: "generate"
        type: choice
        options:
          - generate
          - comments

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements_cricket.txt

      - name: Determine mode
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "flag=${{ github.event.inputs.mode == 'comments' && '--comments' || '' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 14 * * *" ]; then
            echo "flag=--comments" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Cricket scheduler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRICAPI_KEY: ${{ secrets.CRICAPI_KEY }}
          CRICAPI_KEY_2: ${{ secrets.CRICAPI_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_CRICKET || secrets.GROQ_API_KEY }}
          GROQ_API_KEY_SHARED: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_CRICKET || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_SHARED: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY_CRICKET || secrets.PEXELS_API_KEY }}
          PEXELS_API_KEY_SHARED: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CRICKET_YOUTUBE_TOKEN_B64: ${{ secrets.CRICKET_YOUTUBE_TOKEN_B64 }}
          CRICKET_YOUTUBE_CHANNEL_ID: ${{ secrets.CRICKET_YOUTUBE_CHANNEL_ID }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY_CRICKET || secrets.SARVAM_API_KEY }}
          SARVAM_API_KEY_SHARED: ${{ secrets.SARVAM_API_KEY }}
          CRICKET_SARVAM_SPEAKER: ${{ vars.CRICKET_SARVAM_SPEAKER }}
          CRICKET_SARVAM_FALLBACK_SPEAKER: ${{ vars.CRICKET_SARVAM_FALLBACK_SPEAKER }}
          CRICKET_EDGE_VOICE: ${{ vars.CRICKET_EDGE_VOICE }}
          CRICKET_EDGE_RATE: ${{ vars.CRICKET_EDGE_RATE }}
          CRICKET_EDGE_PITCH: ${{ vars.CRICKET_EDGE_PITCH }}
          COMMENT_AGENT_ENABLED: ${{ vars.COMMENT_AGENT_ENABLED || 'false' }}
          COMMENT_AGENT_CHANNELS: ${{ vars.COMMENT_AGENT_CHANNELS || 'cricket' }}
          COMMENT_AGENT_DEFAULT_MODE: ${{ vars.COMMENT_AGENT_DEFAULT_MODE || 'draft' }}
        run: python scheduler_cricket.py ${{ steps.pick.outputs.flag }}

      - name: Upload run log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cricket-scheduler-log-${{ github.run_id }}
          path: output/*.txt
          if-no-files-found: ignore
