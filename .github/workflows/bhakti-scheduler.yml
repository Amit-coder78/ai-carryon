name: Bhakti Scheduler

on:
  schedule:
    # Hourly — scheduler_bhakti.py's own adaptive-hour + daily-cap logic
    # decides whether this particular hour actually generates anything.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force_generate:
        description: "Bypass the schedule gate and daily cap (test run)"
        required: false
        default: "false"
      force_comments:
        description: "Run comment replies now, ignoring the 19:00-23:59 IST window"
        required: false
        default: "false"

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Bhakti scheduler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_BHAKTI || secrets.GROQ_API_KEY }}
          GROQ_API_KEY_SHARED: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_BHAKTI || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_SHARED: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY_BHAKTI || secrets.PEXELS_API_KEY }}
          PEXELS_API_KEY_SHARED: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BHAKTI_TOKEN_JSON: ${{ secrets.BHAKTI_TOKEN_JSON }}
          YOUTUBE_BHAKTI_CHANNEL_ID: ${{ secrets.YOUTUBE_BHAKTI_CHANNEL_ID }}
          BHAKTI_AUTHORITY_CHANNEL_IDS: ${{ secrets.BHAKTI_AUTHORITY_CHANNEL_IDS }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY_BHAKTI || secrets.SARVAM_API_KEY }}
          SARVAM_API_KEY_SHARED: ${{ secrets.SARVAM_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          FORCE_GENERATE: ${{ github.event.inputs.force_generate || 'false' }}
          COMMENT_FORCE: ${{ github.event.inputs.force_comments || 'false' }}
          COMMENT_AGENT_ENABLED: ${{ vars.COMMENT_AGENT_ENABLED || 'false' }}
          COMMENT_AGENT_CHANNELS: ${{ vars.COMMENT_AGENT_CHANNELS || 'cricket' }}
          COMMENT_AGENT_DEFAULT_MODE: ${{ vars.COMMENT_AGENT_DEFAULT_MODE || 'draft' }}
        run: python scheduler_bhakti.py

      - name: Upload run log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhakti-scheduler-log-${{ github.run_id }}
          path: output/scheduler_bhakti_log.txt
          if-no-files-found: ignore
