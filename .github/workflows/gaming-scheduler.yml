name: Gaming Scheduler

on:
  schedule:
    # Every 4 hours (UTC). Adjust to taste once you see real clip volume.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run gaming scheduler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_GAMING || secrets.GROQ_API_KEY }}
          GROQ_API_KEY_SHARED: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_GAMING || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_SHARED: ${{ secrets.GEMINI_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_FOLLOWED_STREAMERS: ${{ secrets.TWITCH_FOLLOWED_STREAMERS }}
          TWITCH_TRACKED_GAMES: ${{ secrets.TWITCH_TRACKED_GAMES }}
          YOUTUBE_GAMING_CLIENT_SECRETS_B64: ${{ secrets.YOUTUBE_GAMING_CLIENT_SECRETS_B64 }}
          YOUTUBE_GAMING_TOKEN_B64: ${{ secrets.YOUTUBE_GAMING_TOKEN_B64 }}
          PYTHONUNBUFFERED: "1"
          GEMINI_TIMEOUT_SECONDS: "40"
          GROQ_MAX_CALLS_PER_RUN: "20"
          GAMING_JUDGE_PROVIDER: "gemini"
          GAMING_JUDGE_ROUTER_FALLBACK: "1"
          GAMING_HOOK_ONLY_FALLBACK: "1"
          # Backup if Gemini is out of quota for a long time (weaker check, the writer model also judges):
          # GAMING_JUDGE_PROVIDER: "router"
          GAMING_SCRIPT_MIN_SCORE: "6.5"
          GAMING_SOFT_FLOOR: "3.5"
          GAMING_ANALYZE_TOP_K: "2"
        run: python scheduler_gaming.py

      - name: Upload run log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaming-scheduler-log-${{ github.run_id }}
          path: output/scheduler_log.txt
          if-no-files-found: ignore
