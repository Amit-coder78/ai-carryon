# Finance scheduler. Review mode is the default (FINANCE_REQUIRE_REVIEW=true): nothing is uploaded, the bundle is saved as an artifact.
# Live upload: set repo variable FINANCE_REQUIRE_REVIEW=false (or use the require_review input on Run workflow) and add secret YOUTUBE_FINANCE_TOKEN_B64 (or FINANCE_TOKEN_JSON).
name: finance-scheduler
on:
  schedule:
    - cron: "30 4 * * 1-5"      # 10:00 IST on weekdays (daily closes only, so one run per trading day is enough)
  workflow_dispatch:
    inputs:
      category: { description: "FINANCE_CATEGORY", default: "indian_markets" }
      content_type: { description: "educational | analytical | historical | news", default: "educational" }
      ticker: { description: "FINANCE_TICKER (optional)", default: "" }
      video_format: { description: "shorts | long", default: "shorts" }
      require_review: { description: "true = save bundle only, false = upload to YouTube (blank = repo variable, default true)", default: "" }
      privacy: { description: "private | unlisted | public (blank = repo variable, default private)", default: "" }
permissions:
  contents: read
concurrency:
  group: finance-scheduler
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_FINANCE || secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_FINANCE || secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY_FINANCE || secrets.PEXELS_API_KEY }}
      FINANCE_FEEDS: ${{ vars.FINANCE_FEEDS }}
      FINANCE_CATEGORY: ${{ inputs.category || vars.FINANCE_CATEGORY || 'indian_markets' }}
      FINANCE_CONTENT_TYPE: ${{ inputs.content_type || vars.FINANCE_CONTENT_TYPE || 'educational' }}
      FINANCE_TICKER: ${{ inputs.ticker || vars.FINANCE_TICKER }}
      FINANCE_FORMAT: ${{ inputs.video_format || vars.FINANCE_FORMAT || 'shorts' }}
      FINANCE_VOICE_IMPL: agents_finance.voice_en:generate_voice
      FINANCE_EDGE_VOICE: ${{ vars.FINANCE_EDGE_VOICE }}
      FINANCE_REQUIRE_REVIEW: ${{ inputs.require_review || vars.FINANCE_REQUIRE_REVIEW || 'true' }}
      FINANCE_TOKEN_JSON: ${{ secrets.FINANCE_TOKEN_JSON }}
      YOUTUBE_FINANCE_TOKEN_B64: ${{ secrets.YOUTUBE_FINANCE_TOKEN_B64 }}
      FINANCE_PRIVACY: ${{ inputs.privacy || vars.FINANCE_PRIVACY || 'private' }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt -r requirements_finance.txt
      - run: python -m unittest tests.test_finance
      - name: Clear files the tests wrote
        run: rm -rf output assets/pexels_clips && mkdir -p output assets/pexels_clips
      - run: python scheduler_finance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: finance-review, path: output/finance_review/, if-no-files-found: ignore, retention-days: 3 }
